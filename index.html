<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVD ISO Search</title>
    <!-- 引入 Tailwind CSS 美化樣式 -->
    <script src="https://tailwindcss.com"></script>
<style>
    table { border-collapse: collapse; width: 100%; table-layout: fixed; }
    thead tr, thead th {
        background-color: #a7f3d0 !important; /* 柔和的淺薄荷綠 */
        color: #064e3b !important;            /* 深森林綠字體，對比清晰 */
    }
    thead th:hover {
        background-color: #6ee7b7 !important; /* 滑鼠移過去稍微加深 */
    }
    th, td { 
        border: 1px solid #4b5563 !important; 
        padding: 10px 12px; 
        white-space: normal !important; 
        word-break: break-word; 
        overflow-wrap: break-word;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
</style>
    
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans flex flex-col">

    <!-- 頂部導覽列與即時檢索框 -->
    <header class="bg-gray-800 border-b border-gray-700 py-5 sticky top-0 z-50 shadow-xl">
        <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold tracking-wider text-emerald-400 flex items-center gap-2">
                📀 <span>DVD ISO Search</span>
            </h1>
            
            <!-- 即時模糊搜尋輸入框 -->
            <div class="w-full md:w-2/3 flex relative shadow-inner">
                <input type="text" id="searchInput" placeholder="關鍵字隨打即搜... (支援片名、硬碟、分類、格式)" 
                       class="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 rounded-l-lg focus:outline-none focus:border-emerald-500 text-white placeholder-gray-400 text-sm">
                <button id="searchBtn" class="bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold px-5 py-2.5 transition text-sm border-r border-emerald-600">
                 搜尋
                </button>
                <button id="showAllBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold px-4 py-2.5 rounded-r-lg transition text-sm whitespace-nowrap">
                 列出全部
                </button>

            </div>
        </div>
    </header>

    <!-- 主要資料表格呈現區 -->
    <main class="container mx-auto px-4 py-6 flex-grow flex flex-col">
        <div class="flex justify-between items-center mb-4">
            <h2 id="listTitle" class="text-sm font-semibold text-gray-400 uppercase tracking-wider">📊 清單檢視 (點擊欄位標頭可自由排序 ↕️)</h2>
            <span id="movieCount" class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-xs font-mono font-bold border border-emerald-500/20">正在連線讀取 DVD ISO list.txt...</span>
        </div>
        
        <!-- 表格容器 -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-2xl flex-grow overflow-hidden flex flex-col">
            <div class="overflow-x-auto custom-scrollbar flex-grow">
               <table class="w-full text-left border-collapse min-w-[1200px]">
    <thead>
        <tr id="tableHeadRow" class="text-xs font-bold uppercase tracking-wider sticky top-0 z-10 shadow-sm select-none">
            <!-- 表頭會由 JavaScript 依據 Google 試算表動態生成 -->
        </tr>
    </thead>
    <tbody id="movieTableBody" class="divide-y divide-gray-700/60 text-xs text-gray-300">
        <!-- 資料列會由 JavaScript 動態生成 -->
    </tbody>
</table>
            </div>
            
            <!-- 無符合資料提示 -->
            <div id="noResult" class="hidden text-center py-20 text-gray-500">
                <p class="text-base mb-1">🔍 找不到符合條件的影音檔案</p>
                <p class="text-xs text-gray-600">請嘗試檢查是否有錯字，或更換其他關鍵字搜尋。</p>
            </div>
        </div>
    </main>

    <footer class="bg-gray-950/40 border-t border-gray-800/60 py-3 text-center text-xs text-gray-600 font-mono">
        Internal Media Database Finder Engine.
    </footer>

    <!-- 🟢 所有的 JavaScript 邏輯都已經完美收納在下方標籤中，不會再外流到畫面上了 🟢 -->
        <script>
    let dvdDatabase = new Array();
    let tableHeaders = new Array(); // 動態儲存從試算表抓到的所有欄位名稱
    let currentSortKey = '';
    let isAscending = true;

    const tableHeadRow = document.getElementById('tableHeadRow');
    const tableBody = document.getElementById('movieTableBody');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const showAllBtn = document.getElementById('showAllBtn');
    let isShowingAll = false; // 記錄目前是否處於「列出全部」模式
    const clearBtn = document.getElementById('clearBtn');
    const movieCount = document.getElementById('movieCount');
    const noResult = document.getElementById('noResult');

    function fetchAndParseData() {
        movieCount.textContent = "正在連線讀取 Google 試算表...";

        const d1 = 'https://' + 'docs' + '.google.com';
        const d2 = '/spreadsheets/d/';
        const sheetId = '1hvu5MGeDlieav33qFlDuLdDI0U0LQ4CxfxtZ3wc6b5U';
        const gid = '1459482754';
        const callbackName = 'loadDynamicSheetCallback';

        window[callbackName] = function(response) {
            try {
                if (!response || response.status === 'error') {
                    throw new Error('試算表讀取失敗，請確認已開啟「知道連結的任何人均可檢視」');
                }

                const cols = response.table.cols;
                const rows = response.table.rows;
                tableHeaders = new Array();
                let headerRowIndex = -1;

                // 1. 優先從 Google API 的欄位標籤讀取標題
                cols.forEach(col => {
                    if (col && col.label && col.label.trim() !== '') {
                        tableHeaders.push(col.label.trim());
                    }
                });

                // 2. 若標題位於資料列的第一列，則自動擷取該列作為動態表頭
                if (tableHeaders.length === 0 && rows.length > 0 && rows.c) {
                    headerRowIndex = 0;
                    rows.c.forEach(cell => {
                        let val = cell ? (cell.f || cell.v || '') : '';
                        if (val.toString().trim() !== '') {
                            tableHeaders.push(val.toString().trim());
                        }
                    });
                }

                // 動態生成淺綠色表頭
                renderTableHeaders();

                // 3. 依據動態欄位數量逐列解析資料
                dvdDatabase = new Array();
                for (let i = 0; i < rows.length; i++) {
                    if (i === headerRowIndex) continue; // 跳過已當作標題的那一列
                    const rowCells = rows[i].c;
                    if (!rowCells) continue;

                    const item = {};
                    let hasData = false;

                    tableHeaders.forEach((headerName, index) => {
                        const cell = rowCells[index];
                        let val = cell ? (cell.f !== undefined && cell.f !== null ? cell.f : cell.v) : '';
                        let cleanVal = (val !== null && val !== undefined && val.toString().trim() !== '') ? val.toString().trim() : '-';
                        item[headerName] = cleanVal;
                        if (cleanVal !== '-') hasData = true;
                    });

                    if (hasData) {
                        dvdDatabase.push(item);
                    }
                }

                movieCount.textContent = `已載入 ${dvdDatabase.length} 筆資料（共 ${tableHeaders.length} 個欄位），請輸入關鍵字搜尋`;
            } catch (err) {
                console.error(err);
                movieCount.textContent = "載入失敗：" + err.message;
            }
        };

        const script = document.createElement('script');
        script.src = d1 + d2 + sheetId + '/gviz/tq?tqx=responseHandler:' + callbackName + '&gid=' + gid;
        script.onerror = function() {
            movieCount.textContent = "載入失敗：無法連線至 Google 試算表";
        };
        document.body.appendChild(script);
    }

    // 動態繪製表頭（自動平均分配等寬）
    function renderTableHeaders() {
        tableHeadRow.innerHTML = '';
        tableHeaders.forEach(header => {
            const th = document.createElement('th');
            th.className = 'py-3.5 px-4 cursor-pointer transition border border-gray-400 break-words';
            th.textContent = header + ' ↕️';
            th.onclick = () => sortTable(header);
            tableHeadRow.appendChild(th);
        });
    }

    // 動態繪製資料列
    function renderTable(data) {
        tableBody.innerHTML = '';
        movieCount.textContent = `共找到 ${data.length} 筆資料`;

        if (data.length === 0) {
            noResult.classList.remove('hidden');
            return;
        }
        noResult.classList.add('hidden');

        data.forEach(item => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-gray-700/40 transition duration-150 border-b border-gray-800/40';

            tableHeaders.forEach((header, index) => {
                const td = document.createElement('td');
                const val = item[header] || '-';
                const lowerVal = val.toLowerCase();

                // 針對 YES / NO 狀態欄位自動套用紅綠標籤
                if (lowerVal === 'yes' || lowerVal === 'y' || lowerVal === '有' || lowerVal === 'true') {
                    td.className = 'py-3 px-4 text-center font-mono border border-gray-700';
                    td.innerHTML = `<span class="bg-green-500/10 text-green-400 px-2 py-0.5 rounded border border-green-500/20 font-bold text-[10px]">YES</span>`;
                } else if (lowerVal === 'no' || lowerVal === 'n' || lowerVal === '無' || lowerVal === 'false') {
                    td.className = 'py-3 px-4 text-center font-mono border border-gray-700';
                    td.innerHTML = `<span class="bg-red-500/10 text-red-400 px-2 py-0.5 rounded border border-red-500/20 font-bold text-[10px]">NO</span>`;
                } else {
                    // 第一欄（片名）加粗顯示，其餘欄位保持標準樣式
                    td.className = index === 0 
                        ? 'py-3 px-4 font-semibold text-gray-200 break-words border border-gray-700'
                        : 'py-3 px-4 text-gray-300 break-words border border-gray-700';
                    td.textContent = val;
                }
                tr.appendChild(td);
            });

            tableBody.appendChild(tr);
        });
    }

    // 全欄位動態模糊搜尋（不論新增幾個欄位都會自動納入搜尋範圍）
    function getFilteredData() {
        const query = searchInput.value.toLowerCase().trim();
        if (!query) return new Array();

        return dvdDatabase.filter(item =>
            tableHeaders.some(header => (item[header] || '').toLowerCase().includes(query))
        );
    }

    function doSearch() {
    const query = searchInput.value.trim();
    isShowingAll = false; // 只要在搜尋框打字或按清除，就切回搜尋模式
    clearBtn.classList.toggle('hidden', !query);

    if (!query) {
        tableBody.innerHTML = '';
        noResult.classList.add('hidden');
        movieCount.textContent = `已載入 ${dvdDatabase.length} 筆資料（共 ${tableHeaders.length} 個欄位），請輸入關鍵字搜尋`;
        return;
    }

    renderTable(getFilteredData());
}

function sortTable(key) {
    // 只有在「無關鍵字」且「非列出全部模式」時才禁止排序
    if (!searchInput.value.trim() && !isShowingAll) return;

    if (currentSortKey === key) {
        isAscending = !isAscending;
    } else {
        currentSortKey = key;
        isAscending = true;
    }

    // 依據目前模式決定要排序「全部資料」還是「搜尋結果」
    const currentData = isShowingAll ? [...dvdDatabase] : getFilteredData();
    
    currentData.sort((a, b) => {
        const valA = a[key] || '';
        const valB = b[key] || '';

        const cleanNumA = valA.replace(/,/g, '');
        const cleanNumB = valB.replace(/,/g, '');
        if (cleanNumA !== '' && cleanNumB !== '' && !isNaN(cleanNumA) && !isNaN(cleanNumB)) {
            return isAscending ? Number(cleanNumA) - Number(cleanNumB) : Number(cleanNumB) - Number(cleanNumA);
        }

        return isAscending
            ? valA.localeCompare(valB, 'zh-Hans-TW', { sensitivity: 'accent' })
            : valB.localeCompare(valA, 'zh-Hans-TW', { sensitivity: 'accent' });
    });

    renderTable(currentData);
}


    searchBtn.addEventListener('click', doSearch);
    searchInput.addEventListener('input', doSearch);
    clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    showAllBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.classList.add('hidden');
    isShowingAll = true;
    renderTable(dvdDatabase);
    movieCount.textContent = `目前顯示全部 ${dvdDatabase.length} 筆資料`;
});

        doSearch();
    });

    window.addEventListener('DOMContentLoaded', fetchAndParseData);
</script>

</body>
</html>
