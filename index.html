<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVD ISO Search</title>
    <!-- 引入 Tailwind CSS 美化樣式 -->
    <script src="https://tailwindcss.com"></script>
<style>
    table { border-collapse: collapse; width: 100%; table-layout: fixed; }
    th, td { 
        border: 1px solid #4b5563 !important; 
        padding: 10px 12px; 
        white-space: normal !important; 
        word-break: break-word; 
        overflow-wrap: break-word;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans flex flex-col">

    <!-- 頂部導覽列與即時檢索框 -->
    <header class="bg-gray-800 border-b border-gray-700 py-5 sticky top-0 z-50 shadow-xl">
        <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold tracking-wider text-emerald-400 flex items-center gap-2">
                📀 <span>DVD ISO Search</span>
            </h1>
            
            <!-- 即時模糊搜尋輸入框 -->
            <div class="w-full md:w-2/3 flex relative shadow-inner">
                <input type="text" id="searchInput" placeholder="關鍵字隨打即搜... (支援片名、硬碟、分類、格式)" 
                       class="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 rounded-l-lg focus:outline-none focus:border-emerald-500 text-white placeholder-gray-400 text-sm">
                <button id="clearBtn" class="absolute right-24 top-2.5 text-gray-400 hover:text-white text-sm hidden">清除</button>
                <button id="searchBtn" class="bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold px-6 py-2.5 rounded-r-lg transition text-sm">
                    搜尋
                </button>
            </div>
        </div>
    </header>

    <!-- 主要資料表格呈現區 -->
    <main class="container mx-auto px-4 py-6 flex-grow flex flex-col">
        <div class="flex justify-between items-center mb-4">
            <h2 id="listTitle" class="text-sm font-semibold text-gray-400 uppercase tracking-wider">📊 清單檢視 (點擊欄位標頭可自由排序 ↕️)</h2>
            <span id="movieCount" class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-xs font-mono font-bold border border-emerald-500/20">正在連線讀取 DVD ISO list.txt...</span>
        </div>
        
        <!-- 表格容器 -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-2xl flex-grow overflow-hidden flex flex-col">
            <div class="overflow-x-auto custom-scrollbar flex-grow">
               <table class="w-full table-fixed text-left border-collapse min-w-[1200px]">
                    <thead>
    <tr class="bg-gray-800 text-gray-300 text-xs uppercase tracking-wider sticky top-0 z-10 shadow-sm select-none">
        <th class="py-3.5 px-4 font-bold text-emerald-400 cursor-pointer hover:bg-gray-700 transition border border-gray-700" onclick="sortTable('Name')">Name (片名) ↕️</th>
        <th class="py-3.5 px-4 cursor-pointer hover:bg-gray-700 transition border border-gray-700" onclick="sortTable('Folder')">Folder ↕️</th>
        <th class="py-3.5 px-4 cursor-pointer hover:bg-gray-700 transition border border-gray-700" onclick="sortTable('Category')">Category ↕️</th>
        <th class="py-3.5 px-4 text-center cursor-pointer hover:bg-gray-700 transition border border-gray-700" onclick="sortTable('Backup')">Backup ↕️</th>
        <th class="py-3.5 px-4 cursor-pointer hover:bg-gray-700 transition border border-gray-700" onclick="sortTable('Size')">Size ↕️</th>
        <th class="py-3.5 px-4 text-center cursor-pointer hover:bg-gray-700 transition border border-gray-700" onclick="sortTable('Original File')">Original File ↕️</th>
        <th class="py-3.5 px-4 cursor-pointer hover:bg-gray-700 transition border border-gray-700" onclick="sortTable('Current Storage')">Current Storage ↕️</th>
        <th class="py-3.5 px-4 cursor-pointer hover:bg-gray-700 transition border border-gray-700" onclick="sortTable('Backup Site')">Backup Site ↕️</th>
    </tr>
</thead>
                    <tbody id="movieTableBody" class="divide-y divide-gray-700/60 text-xs text-gray-300">
                        <!-- 資料由 JS 自動填入 -->
                    </tbody>
                </table>
            </div>
            
            <!-- 無符合資料提示 -->
            <div id="noResult" class="hidden text-center py-20 text-gray-500">
                <p class="text-base mb-1">🔍 找不到符合條件的影音檔案</p>
                <p class="text-xs text-gray-600">請嘗試檢查是否有錯字，或更換其他關鍵字搜尋。</p>
            </div>
        </div>
    </main>

    <footer class="bg-gray-950/40 border-t border-gray-800/60 py-3 text-center text-xs text-gray-600 font-mono">
        Internal Media Database Finder Engine.
    </footer>

    <!-- 🟢 所有的 JavaScript 邏輯都已經完美收納在下方標籤中，不會再外流到畫面上了 🟢 -->
        <script>
        let dvdDatabase = new Array();
        let currentSortKey = '';
        let isAscending = true;

        const tableBody = document.getElementById('movieTableBody');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const clearBtn = document.getElementById('clearBtn');
        const movieCount = document.getElementById('movieCount');
        const noResult = document.getElementById('noResult');

        function fetchAndParseData() {
    movieCount.textContent = "正在連線讀取 Google 試算表...";

    const sheetId = '1hvu5MGeDlieav33qFlDuLdDI0U0LQ4CxfxtZ3wc6b5U';
    const gid = '1459482754';
    const callbackName = 'googleSheetCallback';

    // 建立全域接收函式，完美避開瀏覽器 CORS 阻擋
    window[callbackName] = function(response) {
        try {
            if (!response || response.status === 'error') {
                throw new Error('試算表讀取被拒，請確認已開啟「知道連結的任何人均可檢視」');
            }

            const rows = response.table.rows;
            const keys = ["Name", "Folder", "Category", "Backup", "Size", "Original File", "Current Storage", "Backup Site"];
            dvdDatabase = new Array();

            for (let i = 0; i < rows.length; i++) {
                const rowCells = rows[i].c;
                if (!rowCells) continue;

                // 若第一列不小心被當成資料讀進來，自動跳過標題列
                const firstVal = rowCells[0] ? (rowCells[0].f || rowCells[0].v || '') : '';
                if (i === 0 && firstVal.toString().trim() === 'Name') continue;

                const item = {};
                keys.forEach((key, index) => {
                    const cell = rowCells[index];
                    // 優先取用試算表顯示格式 (f，可保留千分位逗號)，若無則取原始值 (v)
                    let val = cell ? (cell.f !== undefined && cell.f !== null ? cell.f : cell.v) : '';
                    item[key] = (val !== null && val !== undefined && val.toString().trim() !== '') ? val.toString().trim() : '-';
                });

                if (item.Name !== '-') {
                    dvdDatabase.push(item);
                }
            }

            movieCount.textContent = `已載入 ${dvdDatabase.length} 筆資料，請輸入關鍵字搜尋`;
        } catch (err) {
            console.error(err);
            movieCount.textContent = "載入失敗：" + err.message;
        }
    };

    // 動態插入 Google Visualization API 腳本標籤
    const script = document.createElement('script');
    const baseDomain = 'https://google.com';
    script.src = baseDomain + sheetId + '/gviz/tq?tqx=responseHandler:' + callbackName + '&gid=' + gid;

    script.onerror = function() {
        movieCount.textContent = "載入失敗：無法連線至 Google 試算表，請檢查網路或公開權限";
    };
    document.body.appendChild(script);
}

        function renderTable(data) {
            tableBody.innerHTML = '';
            movieCount.textContent = `共 ${data.length} 筆資料`;

            if (data.length === 0) {
                noResult.classList.remove('hidden');
                return;
            }
            noResult.classList.add('hidden');

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-700/40 transition duration-150 border-b border-gray-800/40';

                const isBackupNo = (item.Backup || '').toLowerCase() === 'no' || item.Backup === '無';
                const backupBadge = isBackupNo
                    ? `<span class="bg-red-500/10 text-red-400 px-2 py-0.5 rounded border border-red-500/20 font-bold text-[10px]">NO</span>`
                    : `<span class="bg-green-500/10 text-green-400 px-2 py-0.5 rounded border border-green-500/20 font-bold text-[10px]">YES</span>`;

                const isOrgFileYes = (item["Original File"] || '').toLowerCase() === 'yes' || item["Original File"] === '有';
                const orgFileBadge = isOrgFileYes
                    ? `<span class="bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20 font-medium">YES</span>`
                    : `<span class="text-gray-500">${item["Original File"]}</span>`;

                let formattedSize = item.Size || '-';

                tr.innerHTML = `
    <td class="py-3 px-4 font-semibold text-gray-100 break-words border border-gray-700">${item.Name}</td>
    <td class="py-3 px-4 font-mono text-gray-400 break-words border border-gray-700">${item.Folder}</td>
    <td class="py-3 px-4 break-words border border-gray-700"><span class="bg-gray-900/60 px-2 py-0.5 rounded text-gray-400 border border-gray-700">${item.Category}</span></td>
    <td class="py-3 px-4 text-center border border-gray-700">${backupBadge}</td>
    <td class="py-3 px-4 font-mono text-gray-400 break-all border border-gray-700">${formattedSize}</td>
    <td class="py-3 px-4 text-center font-mono border border-gray-700">${orgFileBadge}</td>
    <td class="py-3 px-4 text-emerald-400/90 font-medium break-words border border-gray-700">${item["Current Storage"]}</td>
    <td class="py-3 px-4 text-gray-400 break-words border border-gray-700">${item["Backup Site"]}</td>
`;

                tableBody.appendChild(tr);
            });
        }

        function getFilteredData() {
    const query = searchInput.value.toLowerCase().trim();
    if (!query) return new Array();

    return dvdDatabase.filter(item =>
        (item.Name || '').toLowerCase().includes(query) ||
        (item.Folder || '').toLowerCase().includes(query) ||
        (item.Category || '').toLowerCase().includes(query) ||
        (item.Backup || '').toLowerCase().includes(query) ||
        (item.Size || '').toLowerCase().includes(query) ||
        (item["Original File"] || '').toLowerCase().includes(query) ||
        (item["Current Storage"] || '').toLowerCase().includes(query) ||
        (item["Backup Site"] || '').toLowerCase().includes(query)
    );
}

function doSearch() {
    const query = searchInput.value.trim();
    clearBtn.classList.toggle('hidden', !query);
    
    if (!query) {
        tableBody.innerHTML = '';
        noResult.classList.add('hidden');
        movieCount.textContent = `已載入 ${dvdDatabase.length} 筆資料，請輸入關鍵字搜尋`;
        return;
    }
    
    renderTable(getFilteredData());
}

        function sortTable(key) {
            if (!searchInput.value.trim()) return;
            if (currentSortKey === key) {
                isAscending = !isAscending;
            } else {
                currentSortKey = key;
                isAscending = true;
            }

            const currentData = getFilteredData();
            currentData.sort((a, b) => {
                let valA = a[key] || '';
                let valB = b[key] || '';

                if (key === 'Size') {
                    const numA = parseInt(valA.replace(/,/g, '')) || 0;
                    const numB = parseInt(valB.replace(/,/g, '')) || 0;
                    return isAscending ? numA - numB : numB - numA;
                }
                return isAscending
                    ? valA.localeCompare(valB, 'zh-Hans-TW', { sensitivity: 'accent' })
                    : valB.localeCompare(valA, 'zh-Hans-TW', { sensitivity: 'accent' });
            });
            renderTable(currentData);
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('input', doSearch);
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            doSearch();
        });

        window.addEventListener('DOMContentLoaded', fetchAndParseData);
    </script>
</body>
</html>
