<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVD ISO Search</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        table { border-collapse: collapse; width: 100%; table-layout: fixed; }
        thead tr, thead th { background-color: #a7f3d0 !important; color: #064e3b !important; }
        thead th:hover { background-color: #6ee7b7 !important; }
        th, td { border: 1px solid #4b5563 !important; padding: 10px 12px; white-space: normal !important; word-break: break-word; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans flex flex-col">

    <header class="bg-gray-800 border-b border-gray-700 py-5 sticky top-0 z-50 shadow-xl">
        <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold tracking-wider text-emerald-400 flex items-center gap-2">
                📀 <span>DVD ISO Search</span>
            </h1>
            <div class="w-full md:w-2/3 flex relative shadow-inner">
                <input type="text" id="searchInput" placeholder="輸入關鍵字搜尋..." 
                       class="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 rounded-l-lg focus:outline-none focus:border-emerald-500 text-white text-sm">
                <button id="clearBtn" class="absolute right-36 top-2.5 text-gray-400 hover:text-white text-sm hidden">清除</button>
                <button id="searchBtn" class="bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold px-5 py-2.5 text-sm border-r border-emerald-600">搜尋</button>
                <button id="showAllBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold px-4 py-2.5 rounded-r-lg text-sm whitespace-nowrap">列出全部</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 flex-grow flex flex-col">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-sm font-semibold text-gray-400">📊 清單檢視 (點擊欄位標頭可排序 ↕️)</h2>
            <span id="movieCount" class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-xs font-mono font-bold border border-emerald-500/20">連線中...</span>
        </div>
        
        <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-2xl flex-grow overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[1200px]">
                <thead><tr id="tableHeadRow" class="text-xs font-bold uppercase sticky top-0 z-10 select-none"></tr></thead>
                <tbody id="movieTableBody" class="divide-y divide-gray-700/60 text-xs text-gray-300"></tbody>
            </table>
            <div id="noResult" class="hidden text-center py-20 text-gray-500">🔍 找不到符合條件的影音檔案</div>
        </div>
    </main>

    <script>
        let dvdDatabase = [], tableHeaders = [], currentSortKey = '', isAscending = true, isShowingAll = false;
        const el = id => document.getElementById(id);

        function fetchAndParseData() {
            el('movieCount').textContent = "正在連線讀取 Google 試算表...";
            const url = 'https://' + 'docs' + '://';

            window.onSheetLoaded = function(res) {
                try {
                    if (!res || res.status === 'error') throw new Error('請確認試算表已設為公開檢視');
                    const cols = res.table.cols, rows = res.table.rows;
                    tableHeaders = cols.map(c => (c && c.label) ? c.label.trim() : '').filter(Boolean);
                    let startRow = 0;

                    if (tableHeaders.length === 0 && rows.length > 0 && rows[0].c) {
                        startRow = 1;
                        rows[0].c.forEach(c => {
                            let v = c ? (c.f || c.v || '') : '';
                            if (v.toString().trim()) tableHeaders.push(v.toString().trim());
                        });
                    }

                    el('tableHeadRow').innerHTML = '';
                    tableHeaders.forEach(h => {
                        const th = document.createElement('th');
                        th.className = 'py-3.5 px-4 cursor-pointer transition';
                        th.textContent = h + ' ↕️';
                        th.onclick = () => sortTable(h);
                        el('tableHeadRow').appendChild(th);
                    });

                    dvdDatabase = [];
                    for (let i = startRow; i < rows.length; i++) {
                        if (!rows[i].c) continue;
                        const item = {};
                        let hasVal = false;
                        tableHeaders.forEach((h, idx) => {
                            const c = rows[i].c[idx];
                            let v = c ? (c.f !== undefined && c.f !== null ? c.f : c.v) : '';
                            let str = (v !== null && v !== undefined && v.toString().trim() !== '') ? v.toString().trim() : '-';
                            item[h] = str;
                            if (str !== '-') hasVal = true;
                        });
                        if (hasVal) dvdDatabase.push(item);
                    }
                    el('movieCount').textContent = `已載入 ${dvdDatabase.length} 筆資料（${tableHeaders.length} 欄），請輸入關鍵字`;
                } catch (e) {
                    el('movieCount').textContent = "載入失敗：" + e.message;
                }
            };

            const s = document.createElement('script');
            s.src = url;
            s.onerror = () => el('movieCount').textContent = "連線失敗，請檢查網路或權限";
            document.body.appendChild(s);
        }

        function renderTable(data) {
            el('movieTableBody').innerHTML = '';
            el('movieCount').textContent = `共顯示 ${data.length} 筆資料`;
            el('noResult').classList.toggle('hidden', data.length > 0);

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-700/40 transition';
                tableHeaders.forEach((h, idx) => {
                    const td = document.createElement('td');
                    const val = item[h] || '-', low = val.toLowerCase();
                    if (['yes', 'y', '有', 'true'].includes(low)) {
                        td.className = 'py-3 px-4 text-center font-mono';
                        td.innerHTML = `<span class="bg-green-500/10 text-green-400 px-2 py-0.5 rounded border border-green-500/20 font-bold text-[10px]">YES</span>`;
                    } else if (['no', 'n', '無', 'false'].includes(low)) {
                        td.className = 'py-3 px-4 text-center font-mono';
                        td.innerHTML = `<span class="bg-red-500/10 text-red-400 px-2 py-0.5 rounded border border-red-500/20 font-bold text-[10px]">NO</span>`;
                    } else {
                        td.className = idx === 0 ? 'py-3 px-4 font-semibold text-gray-200' : 'py-3 px-4 text-gray-300';
                        td.textContent = val;
                    }
                    tr.appendChild(td);
                });
                el('movieTableBody').appendChild(tr);
            });
        }

        function getFilteredData() {
            const q = el('searchInput').value.toLowerCase().trim();
            return q ? dvdDatabase.filter(item => tableHeaders.some(h => (item[h] || '').toLowerCase().includes(q))) : [];
        }

        function doSearch() {
            const q = el('searchInput').value.trim();
            isShowingAll = false;
            el('clearBtn').classList.toggle('hidden', !q);
            if (!q) {
                el('movieTableBody').innerHTML = '';
                el('noResult').classList.add('hidden');
                el('movieCount').textContent = `已載入 ${dvdDatabase.length} 筆資料（${tableHeaders.length} 欄），請輸入關鍵字`;
                return;
            }
            renderTable(getFilteredData());
        }

        function sortTable(key) {
            if (!el('searchInput').value.trim() && !isShowingAll) return;
            isAscending = (currentSortKey === key) ? !isAscending : true;
            currentSortKey = key;
            const list = isShowingAll ? [...dvdDatabase] : getFilteredData();
            list.sort((a, b) => {
                const vA = a[key] || '', vB = b[key] || '';
                const nA = vA.replace(/,/g, ''), nB = vB.replace(/,/g, '');
                if (nA && nB && !isNaN(nA) && !isNaN(nB)) return isAscending ? nA - nB : nB - nA;
                return isAscending ? vA.localeCompare(vB, 'zh-Hant-TW') : vB.localeCompare(vA, 'zh-Hant-TW');
            });
            renderTable(list);
        }

        el('searchBtn').onclick = doSearch;
        el('searchInput').oninput = doSearch;
        el('clearBtn').onclick = () => { el('searchInput').value = ''; doSearch(); };
        el('showAllBtn').onclick = () => {
            el('searchInput').value = '';
            el('clearBtn').classList.add('hidden');
            isShowingAll = true;
            renderTable(dvdDatabase);
        };
        window.onload = fetchAndParseData;
    </script>
</body>
</html>
