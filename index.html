<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVD ISO Search</title>
    <!-- 引入 Tailwind CSS 美化樣式 -->
    <script src="https://tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans flex flex-col">

    <!-- 頂部導覽列與即時檢索框 -->
    <header class="bg-gray-800 border-b border-gray-700 py-5 sticky top-0 z-50 shadow-xl">
        <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold tracking-wider text-emerald-400 flex items-center gap-2">
                📀 <span>DVD ISO Search</span>
            </h1>
            
            <!-- 即時模糊搜尋輸入框 -->
            <div class="w-full md:w-2/3 flex relative shadow-inner">
                <input type="text" id="searchInput" placeholder="關鍵字隨打即搜... (支援片名、硬碟、分類、格式)" 
                       class="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 rounded-l-lg focus:outline-none focus:border-emerald-500 text-white placeholder-gray-400 text-sm">
                <button id="clearBtn" class="absolute right-24 top-2.5 text-gray-400 hover:text-white text-sm hidden">清除</button>
                <button id="searchBtn" class="bg-emerald-500 hover:bg-emerald-600 text-gray-900 font-bold px-6 py-2.5 rounded-r-lg transition text-sm">
                    搜尋
                </button>
            </div>
        </div>
    </header>

    <!-- 主要資料表格呈現區 -->
    <main class="container mx-auto px-4 py-6 flex-grow flex flex-col">
        <div class="flex justify-between items-center mb-4">
            <h2 id="listTitle" class="text-sm font-semibold text-gray-400 uppercase tracking-wider">📊 清單檢視 (點擊欄位標頭可自由排序 ↕️)</h2>
            <span id="movieCount" class="bg-emerald-500/10 text-emerald-400 px-3 py-1 rounded-full text-xs font-mono font-bold border border-emerald-500/20">正在連線讀取 DVD ISO list.txt...</span>
        </div>
        
        <!-- 表格容器 -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-2xl flex-grow overflow-hidden flex flex-col">
            <div class="overflow-x-auto custom-scrollbar flex-grow">
                <table class="w-full text-left border-collapse min-w-[1200px]">
                    <thead>
                        <tr class="bg-gray-750 text-gray-300 text-xs uppercase tracking-wider border-b border-gray-700 sticky top-0 bg-gray-800 z-10 shadow-sm select-none">
                            <th class="py-3.5 px-4 font-bold text-emerald-400 cursor-pointer hover:bg-gray-700 transition" onclick="sortTable('Name')">Name (片名) ↕️</th>
                            <th class="py-3.5 px-4 cursor-pointer hover:bg-gray-700 transition" onclick="sortTable('Folder')">Folder ↕️</th>
                            <th class="py-3.5 px-4 cursor-pointer hover:bg-gray-700 transition" onclick="sortTable('Category')">Category ↕️</th>
                            <th class="py-3.5 px-4 text-center cursor-pointer hover:bg-gray-700 transition" onclick="sortTable('Backup')">Backup ↕️</th>
                            <th class="py-3.5 px-4 cursor-pointer hover:bg-gray-700 transition" onclick="sortTable('Size')">Size ↕️</th>
                            <th class="py-3.5 px-4 text-center cursor-pointer hover:bg-gray-700 transition" onclick="sortTable('Original File')">Original File ↕️</th>
                            <th class="py-3.5 px-4 cursor-pointer hover:bg-gray-700 transition" onclick="sortTable('Current Storage')">Current storage ↕️</th>
                            <th class="py-3.5 px-4 cursor-pointer hover:bg-gray-700 transition" onclick="sortTable('Backup Site')">Backup Site ↕️</th>
                        </tr>
                    </thead>
                    <tbody id="movieTableBody" class="divide-y divide-gray-700/60 text-xs text-gray-300">
                        <!-- 資料由 JS 自動填入 -->
                    </tbody>
                </table>
            </div>
            
            <!-- 無符合資料提示 -->
            <div id="noResult" class="hidden text-center py-20 text-gray-500">
                <p class="text-base mb-1">🔍 找不到符合條件的影音檔案</p>
                <p class="text-xs text-gray-600">請嘗試檢查是否有錯字，或更換其他關鍵字搜尋。</p>
            </div>
        </div>
    </main>

    <footer class="bg-gray-950/40 border-t border-gray-800/60 py-3 text-center text-xs text-gray-600 font-mono">
        Internal Media Database Finder Engine.
    </footer>

    <!-- 🟢 所有的 JavaScript 邏輯都已經完美收納在下方標籤中，不會再外流到畫面上了 🟢 -->
    <script>
        let dvdDatabase = [];
        let currentSortKey = '';
        let isAscending = true;

        const tableBody = document.getElementById('movieTableBody');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const clearBtn = document.getElementById('clearBtn');
        const movieCount = document.getElementById('movieCount');
        const noResult = document.getElementById('noResult');

        // 自動讀取並精準解析指定的 DVD ISO list.txt
        async function fetchAndParseData() {
            try {
                const targetFile = encodeURIComponent('DVD ISO list.txt');
                const response = await fetch(targetFile);
                if (!response.ok) throw new Error('NOT_FOUND');
                
                const rawText = await response.text();
                const lines = rawText.replace(/\r/g, '').split('\n');
                if (lines.length <= 1) return;

                const keys = ["Name", "Folder", "Category", "Backup", "Size", "Original File", "Original Storage", "Backup Site"];

                for (let i = 1; i < lines.length; i++) {
                    const currentLine = lines[i].trim();
                    if (!currentLine) continue;

                    const columns = lines[i].split('\t');
                    const item = {};

                    keys.forEach((key, index) => {
                        let val = columns[index] ? columns[index].trim() : "";
                        
                        if (val.startsWith('="') && val.endsWith('"')) {
                            val = val.substring(2, val.length - 1);
                        } else if (val.startsWith('"') && val.endsWith('"')) {
                            val = val.substring(1, val.length - 1);
                        }
                        item[key] = val || "-";
                    });
                    dvdDatabase.push(item);
                }
                renderTable(dvdDatabase);
            } catch (error) {
                console.error(error);
                movieCount.textContent = "載入失敗";
                movieCount.className = "bg-red-500/10 text-red-400 px-3 py-1 rounded-full text-xs font-bold border border-red-500/20";
                
                if (window.location.protocol === 'file:') {
                    alert("【瀏覽器安全阻擋】\n請在 VS Code 裡點擊右下角的「Go Live」按鈕啟動伺服器環境喔！");
                } else {
                    alert("錯誤：未能在相同路徑下找到 DVD ISO list.txt 檔案，請檢查大小寫及空白是否正確。");
                }
            }
        }

        // 渲染資料到畫面上
        function renderTable(data) {
            tableBody.innerHTML = '';
            movieCount.textContent = `共 ${data.length} 筆資料`;

            if (data.length === 0) {
                noResult.classList.remove('hidden');
                return;
            }
            noResult.classList.add('hidden');

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-700/40 transition duration-150 border-b border-gray-800/40';

                // Backup 顏色標籤
                const isBackupNo = item.Backup.toLowerCase() === 'no' || item.Backup === '無';
                const backupBadge = isBackupNo
                    ? `<span class="bg-red-500/10 text-red-400 px-2 py-0.5 rounded border border-red-500/20 font-bold text-[10px]">NO</span>`
                    : `<span class="bg-green-500/10 text-green-400 px-2 py-0.5 rounded border border-green-500/20 font-bold text-[10px]">YES</span>`;

                // Original File 顏色標籤
                const isOrgFileYes = item["Original File"].toLowerCase() === 'yes' || item["Original File"] === '有';
                const orgFileBadge = isOrgFileYes
                    ? `<span class="bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20 font-medium">YES</span>`
                    : `<span class="text-gray-500">${item["Original File"]}</span>`;

                // Size 單位自動換算
                let formattedSize = item.Size;
                const pureBytes = parseInt(formattedSize.replace(/,/g, ''));
                if (!isNaN(pureBytes)) {
                    formattedSize = (pureBytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
                }

                                tr.innerHTML = `
                    <td class="py-3 px-4 font-semibold text-gray-100 max-w-xs truncate" title="${item.Name}">${item.Name}</td>
                    <td class="py-3 px-4 font-mono text-gray-400">${item.Folder}</td>
                    <td class="py-3 px-4"><span class="bg-gray-900/60 px-2 py-0.5 rounded text-gray-400 border border-gray-700">${item.Category}</span></td>
                    <td class="py-3 px-4 text-center">${backupBadge}</td>
                    <td class="py-3 px-4 font-mono text-gray-400">${formattedSize}</td>
                    <td class="py-3 px-4 text-center font-mono">${orgFileBadge}</td>
                    <td class="py-3 px-4 text-emerald-400/90 font-medium">${item["Current Storage"]}</td>
                    <td class="py-3 px-4 text-gray-400">${item["Backup Site"]}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // 搜尋篩選
        function getFilteredData() {
            const query = searchInput.value.toLowerCase().trim();
            if (!query) return dvdDatabase;

            return dvdDatabase.filter(item => {
                return (
                    item.Name.toLowerCase().includes(query) ||
                    item.Folder.toLowerCase().includes(query) ||
                    item.Category.toLowerCase().includes(query) ||
                    item.Backup.toLowerCase().includes(query) ||
                    item.Size.toLowerCase().includes(query) ||
                    item["Original File"].toLowerCase().includes(query) ||
                    item["Original Storage"].toLowerCase().includes(query) ||
                    item["Backup Site"].toLowerCase().includes(query)
                );
            });
        }

        function doSearch() {
            if (searchInput.value.trim()) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderTable(getFilteredData());
        }

        // 點擊表頭排序
                // 🛠️ 請找到 function sortTable(key) 並將這整段替換進去
        function sortTable(key) {
            if (currentSortKey === key) {
                isAscending = !isAscending;
            } else {
                currentSortKey = key;
                isAscending = true;
            }

            const currentData = getFilteredData();

            currentData.sort((a, b) => {
                let valA = a[key] || '';
                let valB = b[key] || '';

                if (key === 'Size') {
                    const numA = parseInt(valA.replace(/,/g, '')) || 0;
                    const numB = parseInt(valB.replace(/,/g, '')) || 0;
                    return isAscending ? numA - numB : numB - numA;
                }

                return isAscending
                    ? valA.localeCompare(valB, 'zh-Hans-TW', { sensitivity: 'accent' })
                    : valB.localeCompare(valA, 'zh-Hans-TW', { sensitivity: 'accent' });
            });

            renderTable(currentData);
        }

        searchBtn.addEventListener('click', doSearch);
        searchInput.addEventListener('input', doSearch);
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            doSearch();
        });

        window.addEventListener('DOMContentLoaded', fetchAndParseData);

    </script>
</body>
</html>
