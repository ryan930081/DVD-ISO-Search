<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVD ISO Search</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #111827; color: #f3f4f6; margin: 0; padding: 0; }
        header { background-color: #1f2937; border-bottom: 1px solid #374151; padding: 16px 24px; position: sticky; top: 0; z-index: 50; }
        .header-inner { max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
        h1 { color: #34d399; font-size: 20px; margin: 0; }
        .search-box { display: flex; flex: 1; max-width: 600px; }
        input { flex: 1; padding: 10px 14px; background-color: #374151; border: 1px solid #4b5563; border-radius: 6px 0 0 6px; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #10b981; }
        button { padding: 10px 16px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; }
        #clearBtn { background-color: #4b5563; color: #fff; display: none; }
        #searchBtn { background-color: #10b981; color: #111827; }
        #showAllBtn { background-color: #3b82f6; color: #fff; border-radius: 0 6px 6px 0; }
        main { max-width: 1280px; margin: 0 auto; padding: 24px; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
        .status-title { color: #9ca3af; font-size: 14px; margin: 0; }
        #movieCount { background-color: rgba(16, 185, 129, 0.15); color: #34d399; padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: bold; border: 1px solid rgba(16, 185, 129, 0.3); }
        .table-wrap { background-color: #1f2937; border-radius: 8px; overflow-x: auto; border: 1px solid #374151; }
        table { border-collapse: collapse; width: 100%; min-width: 1000px; table-layout: fixed; font-size: 13px; }
        thead tr, thead th { background-color: #a7f3d0 !important; color: #064e3b !important; font-weight: bold; text-align: left; }
        thead th { cursor: pointer; user-select: none; }
        thead th:hover { background-color: #6ee7b7 !important; }
        th, td { border: 1px solid #4b5563; padding: 10px 12px; white-space: normal; word-break: break-word; }
        tbody tr:hover { background-color: rgba(55, 65, 81, 0.5); }
        .badge-yes { background-color: rgba(16, 185, 129, 0.15); color: #34d399; padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(16, 185, 129, 0.3); font-size: 11px; font-weight: bold; }
        .badge-no { background-color: rgba(239, 68, 68, 0.15); color: #f87171; padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(239, 68, 68, 0.3); font-size: 11px; font-weight: bold; }
        .center { text-align: center; }
        #noResult { text-align: center; padding: 48px 16px; color: #9ca3af; display: none; }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <h1>📀 DVD ISO Search</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="輸入關鍵字搜尋...">
                <button id="clearBtn">清除</button>
                <button id="searchBtn">搜尋</button>
                <button id="showAllBtn">列出全部</button>
            </div>
        </div>
    </header>

    <main>
        <div class="status-bar">
            <h2 class="status-title">📊 清單檢視 (點擊欄位標頭可排序 ↕️)</h2>
            <span id="movieCount">準備連線...</span>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr id="tableHeadRow"></tr></thead>
                <tbody id="movieTableBody"></tbody>
            </table>
            <div id="noResult">🔍 找不到符合條件的影音檔案</div>
        </div>
    </main>

    <script>
        var dvdDatabase = [];
        var tableHeaders = [];
        var currentSortKey = '';
        var isAscending = true;
        var isShowingAll = false;

        function el(id) { return document.getElementById(id); }

        function fetchAndParseData() {
            el('movieCount').textContent = "正在連線讀取 Google 試算表...";
            var h = String.fromCharCode(104,116,116,112,115,58,47,47);
            var d = String.fromCharCode(100,111,99,115,46,103,111,111,103,108,101,46,99,111,109);
            var p = '/spreadsheets/d/1hvu5MGeDlieav33qFlDuLdDI0U0LQ4CxfxtZ3wc6b5U/gviz/tq?tqx=responseHandler:onSheetLoaded&gid=1459482754';

            window.onSheetLoaded = function(res) {
                try {
                    if (!res || res.status === 'error') throw new Error('請確認試算表共用權限已設為「知道連結的任何人」');
                    var cols = res.table.cols;
                    var rows = res.table.rows;
                    tableHeaders = [];

                    for (var cIdx = 0; cIdx < cols.length; cIdx++) {
                        if (cols[cIdx] && cols[cIdx].label && cols[cIdx].label.trim() !== '') {
                            tableHeaders.push(cols[cIdx].label.trim());
                        }
                    }

                    var startRow = 0;
                    if (tableHeaders.length === 0 && rows.length > 0 && rows[0].c) {
                        startRow = 1;
                        for (var fIdx = 0; fIdx < rows[0].c.length; fIdx++) {
                            var fCell = rows[0].c[fIdx];
                            var fVal = fCell ? (fCell.f || fCell.v || '') : '';
                            if (fVal.toString().trim() !== '') tableHeaders.push(fVal.toString().trim());
                        }
                    }

                    el('tableHeadRow').innerHTML = '';
                    for (var hIdx = 0; hIdx < tableHeaders.length; hIdx++) {
                        (function(headerName) {
                            var th = document.createElement('th');
                            th.textContent = headerName + ' ↕️';
                            th.onclick = function() { sortTable(headerName); };
                            el('tableHeadRow').appendChild(th);
                        })(tableHeaders[hIdx]);
                    }

                    dvdDatabase = [];
                    for (var i = startRow; i < rows.length; i++) {
                        var r = rows[i];
                        if (!r || !r.c) continue;
                        var item = {};
                        var hasVal = false;
                        for (var j = 0; j < tableHeaders.length; j++) {
                            var hName = tableHeaders[j];
                            var cell = r.c[j];
                            var val = cell ? (cell.f !== undefined && cell.f !== null ? cell.f : cell.v) : '';
                            var str = (val !== null && val !== undefined && val.toString().trim() !== '') ? val.toString().trim() : '-';
                            item[hName] = str;
                            if (str !== '-') hasVal = true;
                        }
                        if (hasVal) dvdDatabase.push(item);
                    }
                    el('movieCount').textContent = '已載入 ' + dvdDatabase.length + ' 筆資料（' + tableHeaders.length + ' 欄），請輸入關鍵字';
                } catch (e) {
                    el('movieCount').textContent = '載入失敗：' + e.message;
                }
            };

            var s = document.createElement('script');
            s.src = h + d + p;
            s.onerror = function() { el('movieCount').textContent = '連線失敗：請確認 Google 試算表共用權限已設為「知道連結的任何人」'; };
            document.body.appendChild(s);
        }

        function renderTable(data) {
            el('movieTableBody').innerHTML = '';
            el('movieCount').textContent = '共顯示 ' + data.length + ' 筆資料';
            el('noResult').style.display = data.length === 0 ? 'block' : 'none';

            for (var i = 0; i < data.length; i++) {
                var item = data[i];
                var tr = document.createElement('tr');
                for (var j = 0; j < tableHeaders.length; j++) {
                    var hName = tableHeaders[j];
                    var td = document.createElement('td');
                    var val = item[hName] || '-';
                    var low = val.toLowerCase();

                    if (low === 'yes' || low === 'y' || low === '有' || low === 'true') {
                        td.className = 'center';
                        td.innerHTML = '<span class="badge-yes">YES</span>';
                    } else if (low === 'no' || low === 'n' || low === '無' || low === 'false') {
                        td.className = 'center';
                        td.innerHTML = '<span class="badge-no">NO</span>';
                    } else {
                        if (j === 0) td.style.fontWeight = 'bold';
                        td.textContent = val;
                    }
                    tr.appendChild(td);
                }
                el('movieTableBody').appendChild(tr);
            }
        }

        function getFilteredData() {
            var q = el('searchInput').value.toLowerCase().trim();
            if (!q) return [];
            return dvdDatabase.filter(function(item) {
                for (var j = 0; j < tableHeaders.length; j++) {
                    var hName = tableHeaders[j];
                    if ((item[hName] || '').toLowerCase().indexOf(q) !== -1) return true;
                }
                return false;
            });
        }

        function doSearch() {
            var q = el('searchInput').value.trim();
            isShowingAll = false;
            el('clearBtn').style.display = q ? 'inline-block' : 'none';
            if (!q) {
                el('movieTableBody').innerHTML = '';
                el('noResult').style.display = 'none';
                el('movieCount').textContent = '已載入 ' + dvdDatabase.length + ' 筆資料（' + tableHeaders.length + ' 欄），請輸入關鍵字';
                return;
            }
            renderTable(getFilteredData());
        }

        function sortTable(key) {
            if (!el('searchInput').value.trim() && !isShowingAll) return;
            isAscending = (currentSortKey === key) ? !isAscending : true;
            currentSortKey = key;
            var list = isShowingAll ? dvdDatabase.slice() : getFilteredData();
            list.sort(function(a, b) {
                var vA = a[key] || '', vB = b[key] || '';
                var nA = vA.replace(/,/g, ''), nB = vB.replace(/,/g, '');
                if (nA && nB && !isNaN(nA) && !isNaN(nB)) return isAscending ? Number(nA) - Number(nB) : Number(nB) - Number(nA);
                return isAscending ? vA.localeCompare(vB, 'zh-Hant-TW') : vB.localeCompare(vA, 'zh-Hant-TW');
            });
            renderTable(list);
        }

        el('searchBtn').onclick = doSearch;
        el('searchInput').oninput = doSearch;
        el('clearBtn').onclick = function() { el('searchInput').value = ''; doSearch(); };
        el('showAllBtn').onclick = function() {
            el('searchInput').value = '';
            el('clearBtn').style.display = 'none';
            isShowingAll = true;
            renderTable(dvdDatabase);
        };
        window.onload = fetchAndParseData;
    </script>
</body>
</html>
